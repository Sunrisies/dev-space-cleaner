name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_recycle_test:
        description: '尝试使用 Finder 回收临时测试目录（可能需要交互授权）'
        type: boolean
        default: false
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-checks
          path: |
            docs/screenshots/*.png
            test-results/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test -p huanj-core -- --nocapture
      - run: cargo test -p huanj --lib
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}
      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app --target ${{ matrix.target }}
      - name: Archive macOS application preserving executable permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          apps=(target/${{ matrix.target }}/release/bundle/macos/*.app)
          test -d "${apps[0]}"
          /usr/libexec/PlistBuddy -c 'Print :NSAppleEventsUsageDescription' "${apps[0]}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSRemovableVolumesUsageDescription' "${apps[0]}/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "target/${{ matrix.target }}/release/huanj-macos-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: huanj-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/huanj.exe
            target/${{ matrix.target }}/release/huanj-macos-${{ matrix.target }}.zip
      - name: Optional macOS Finder recycle test
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.macos_recycle_test
        timeout-minutes: 2
        run: cargo test -p huanj-core recycles_generated_macos_fixture -- --ignored --nocapture
